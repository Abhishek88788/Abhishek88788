name: Generate 3D GitHub Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight (UTC)
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build 3D Contribution Graph

    steps:
      # Step 1: Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Generate 3D contribution graph
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@main
        with:
          USERNAME: Abhishek88788             # 👈 your GitHub username
          theme: "night-green"                # 🎨 choose your theme
          output: "profile-3d-contrib/profile-night-green.svg"
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT }}

      # Step 3: Commit and push the generated SVG back to repo
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-green.svg
          git commit -m "chore: update 3D contribution graph" || echo "No changes to commit"
          git push
