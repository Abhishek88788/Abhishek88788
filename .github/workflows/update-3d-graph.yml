name: Generate 3D GitHub Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight (UTC)
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build 3D Contribution Graph

    steps:
      # Step 1: Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # Use your personal token for read/write access

      # Step 2: Generate 3D contribution graph
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          USERNAME: Abhishek88788
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          theme: "night-green"
          output: "profile-3d-contrib/profile-night-green.svg"

      # Step 3: Commit and push the generated SVG
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-green.svg
          git commit -m "chore: update 3D contribution graph" || echo "No changes to commit"
          git push https://Abhishek88788:${{ secrets.GH_PAT }}@github.com/Abhishek88788/Abhishek88788.git HEAD:main
